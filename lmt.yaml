# lm-training: everything that defines a training run lives in this file.
#
#   lmt train <gpu_hours>
#
# This command measures the GPU and derives every value marked "derived" below
# from the budget. To pin a derived value, set it to a number, and the solver
# works around it. README.md lists the source for each default.

data:
  dataset: HuggingFaceFW/fineweb-edu   # any Hugging Face dataset with a text column
  subset: sample-10BT                  # dataset config name; use sample-100BT for big runs
  split: train
  text_column: text
  val_tokens: 2_097_152                # held-out tokens for measuring eval loss
  token_margin: 0.1                    # tokenize 10% more than the plan needs

tokenizer:                             # byte-level BPE trained on the dataset
  vocab_size: 32768                    # 2^15, as in nanochat; fits in uint16 shards
  train_chars: 500_000_000             # characters of text to train it on

model:
  # Shape rules. The budget sets num_hidden_layers, and these derive the rest.
  aspect_ratio: 64                     # hidden_size is about aspect_ratio x layers (nanochat)
  head_dim: 64                         # as in SmolLM2, Llama 3.2 1B, and Qwen2.5-0.5B
  width_multiple: 128                  # round hidden_size up to a multiple of this
  kv_groups: 1                         # query heads per KV head; 1 is standard attention
  ffn_ratio: 2.6667                    # intermediate_size = 8/3 x hidden_size, as in Llama
  ffn_multiple: 128
  min_layers: 2
  max_layers: 64
  # Passed directly to transformers.LlamaConfig. Setting a shape field here
  # (num_hidden_layers, hidden_size, num_attention_heads, num_key_value_heads,
  # or intermediate_size) pins it instead of deriving it.
  llama:
    tie_word_embeddings: true          # as in SmolLM2, small Qwen models, and Llama 3.2 1B/3B
    rope_parameters: {rope_type: default, rope_theta: 10000.0}
    rms_norm_eps: 1.0e-5
    initializer_range: 0.02
    hidden_act: silu
    attention_bias: false
    mlp_bias: false

scaling:
  tokens_per_param: 20                 # Chinchilla, counting all parameters (Pearce & Song 2024)
  learning_rate: {coef: 0.3118, exp: -0.125}  # DeepSeek LLM: lr = 0.3118 * C^-0.125
  batch_tokens: {coef: 0.2920, exp: 0.3271}   # DeepSeek LLM: tokens = 0.2920 * C^0.3271
  initial_mfu: 0.4                     # starting guess for achieved FLOP/s, as a fraction of matmul peak
  max_plan_iterations: 4               # most benchmark-and-resize rounds before settling on a shape
  bench_warmup_steps: 5                # untimed steps first, which also absorb torch.compile
  bench_steps: 15                      # timed steps
  memory_headroom: 0.85                # use at most this fraction of GPU memory

training:
  seq_len: 2048
  learning_rate: null                  # derived from scaling.learning_rate
  batch_tokens: null                   # derived from scaling.batch_tokens
  micro_batch_size: null               # derived: the largest power of 2 that fits
  warmup_frac: 0.02                    # warm up for 2% of the planned steps,
  max_warmup_steps: 2000               # but no more than 2000 (DeepSeek, SmolLM2)
  decay_frac: 0.2                      # decay the LR over the last 20% of the time budget
  decay_shape: 1-sqrt                  # 1-sqrt or linear (Hägele et al. 2024 favor 1-sqrt)
  final_lr_ratio: 0.0
  weight_decay: 0.1                    # AdamW settings used by Llama, DeepSeek, and OLMo 2
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  checkpoint_every_minutes: 20
  keep_checkpoints: 2
  eval_every_minutes: 10
  log_every_steps: 10
  torch_compile: auto                  # auto turns it on only where Triton is installed (Linux)
  attn_implementation: sdpa
  dataloader_workers: 2
  seed: 0
  report_to: none                      # or wandb, tensorboard, or trackio

compute:
  backend: local                       # local or modal
  gpus: null                           # local only; null uses every visible GPU
  prepare_on: auto                     # modal only: where to tokenize (auto, local, or modal)
  modal:
    gpu: H100!:1                       # the ! stops Modal from swapping in an H200
    volume: lm-training
    cpu: 16                            # CPUs for the tokenization container
    timeout_hours: 24                  # per attempt; 24 is Modal's maximum
    max_retries: 10                    # each retry resumes from the last checkpoint
    secrets: []                        # Modal secret names, e.g. [huggingface] for gated datasets

paths:                                 # relative to this file locally, or to the volume on Modal
  data: data
  runs: runs
